name: Deploy HTML to Somee

# Kích hoạt luồng công việc mỗi khi push (đẩy) code lên nhánh main
on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to Somee via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cài đặt .NET 11 SDK (bộ công cụ phát triển) trên máy ảo GitHub
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      # Biên dịch và đóng gói kèm môi trường chạy (Self-contained) cho máy chủ Windows của Somee
      - name: Build and Publish
        run: dotnet publish -c Release -r win-x86 --self-contained true -o ./publish

      # Chỉ đẩy thư mục ./publish (thành phẩm) lên Somee thay vì đẩy mã nguồn thô
      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./publish/                  # Trỏ nguồn đẩy vào thư mục vừa publish
          server-dir: /www.lab7cicd1417.somee.com/
          dangerous-clean-slate: true            # Xóa file cũ (như index.html) trên Somee trước khi đẩy bản mới